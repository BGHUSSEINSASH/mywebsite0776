<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://api.github.com https://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto: https://wa.me; upgrade-insecure-requests">
  <title>Requests — BG Sash admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <style>
    :root { --bg:#0e0f11; --fg:#e9e6dd; --muted:#9a978f; --line:rgba(233,230,221,.14); --accent:#ff5a2a; --card:#17181b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI", system-ui, sans-serif; padding:32px; }
    h1 { font-size:18px; text-transform:uppercase; letter-spacing:.04em; }
    .muted { color:var(--muted); }
    #gate { max-width:420px; margin:12vh auto; text-align:center; }
    input, select { background:var(--card); border:1px solid var(--line); color:var(--fg); padding:12px 14px; border-radius:6px; font:inherit; width:100%; }
    button { background:var(--accent); border:0; color:#fff; font:inherit; font-weight:600; padding:12px 22px; border-radius:6px; cursor:pointer; }
    button:hover { filter:brightness(1.1); }
    button.lock { background:transparent; border:1px solid var(--line); color:var(--muted); font-size:11px; padding:4px 10px; margin-inline-start:10px; }
    #login { display:flex; gap:10px; margin-top:18px; }
    table { width:100%; border-collapse:collapse; margin:18px 0 34px; }
    th, td { text-align:start; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
    tr:hover td { background:rgba(255,255,255,.02); }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; border:1px solid var(--line); }
    .pill.new { color:var(--accent); border-color:var(--accent); }
    select.status { width:auto; padding:4px 8px; font-size:12px; }
    .wrap { max-width:1200px; margin:0 auto; }
    .err { color:var(--accent); margin-top:12px; }
    @media (max-width:820px){ td,th{padding:8px 6px;font-size:12px} .hide-sm{display:none} }
  </style>
</head>
<body>
  <div id="gate">
    <h1>Requests admin</h1>
    <p class="muted">Enter the admin password to see saved requests.</p>
    <form id="login">
      <input type="password" id="pw" placeholder="admin password" autocomplete="current-password">
      <button type="submit">Open</button>
    </form>
    <p class="err" id="err"></p>
  </div>

  <div class="wrap" id="board" hidden>
    <h1>Requests <span class="muted" id="stamp"></span> <button type="button" id="lockBtn" class="lock">Lock</button></h1>
    <h2>Build requests</h2>
    <table id="reqTable">
      <thead><tr><th>When</th><th>Service</th><th>Budget</th><th>Name</th><th>Contact</th><th class="hide-sm">Details</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
    <h2>Contact messages</h2>
    <table id="msgTable">
      <thead><tr><th>When</th><th>Name</th><th>Email</th><th>Message</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script src="assets/js/admin.js?v=r23"></script>
</body>
</html>
